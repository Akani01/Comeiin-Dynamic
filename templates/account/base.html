{% extends 'base.html' %}
{% load static %}

{% block title %}Sign out | Comeiin Works{% endblock %}

{% block content %}
<section class="section">
  <div style="max-width: 420px; margin: 80px auto; padding: 40px 34px; background: #fff; border: 1px solid #e8e2d4; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);">
    <h1 style="color: #0f172a; font-size: 1.5rem; margin: 0 0 12px;">Sign out?</h1>
    <p style="color: #64748b; margin-bottom: 24px;">Are you sure you want to sign out of your Comeiin Works account?</p>

    <form method="post" action="{% url 'account_logout' %}" style="display:flex; gap:12px; justify-content:center;">
      {% csrf_token %}
      <button type="submit" style="padding:12px 24px; border-radius:10px; border:none; background:linear-gradient(135deg,#f0d38a,#d7a94b); color:#17120a; font-weight:700; cursor:pointer;">Yes, sign out</button>
      <a href="{% url 'core:home' %}" style="padding:12px 24px; border-radius:10px; border:1px solid #e8e2d4; color:#0f172a; text-decoration:none; font-weight:700;">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
