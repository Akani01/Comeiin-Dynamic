{% extends 'base.html' %}
{% load static %}

{% block title %}Reset password | Comeiin Works{% endblock %}

{% block content %}
<section class="section">
  <div style="max-width: 460px; margin: 60px auto; padding: 40px 34px; background: #fff; border: 1px solid #e8e2d4; border-radius: 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);">
    <p style="color: #d7a94b; font-weight: 700; letter-spacing: 0.1em; font-size: 0.74rem; margin: 0 0 10px;">FORGOT PASSWORD?</p>
    <h1 style="color: #0f172a; font-size: 1.6rem; margin: 0 0 8px;">Reset your password</h1>
    <p style="color: #64748b; margin-bottom: 24px;">Enter your email and we'll send a reset link.</p>

    <form method="post" action="{% url 'account_reset_password' %}" style="display:flex; flex-direction:column; gap:14px;">
      {% csrf_token %}
      <label style="display:flex; flex-direction:column; gap:6px; font-weight:600; color:#0f172a; font-size:0.85rem;">
        Email address
        <input type="email" name="email" required autofocus placeholder="you@example.com"
               style="padding:12px 14px; border:1px solid #e8e2d4; border-radius:10px; font-size:0.95rem; background:#fdfcf8;" />
      </label>
      <button type="submit" style="padding:13px 18px; border-radius:11px; border:none; background:linear-gradient(135deg,#f0d38a,#d7a94b); color:#17120a; font-weight:800; cursor:pointer;">Send reset link</button>
    </form>

    <p style="margin-top: 20px; font-size: 0.85rem; text-align: center;">
      <a href="{% url 'account_login' %}" style="color: #d7a94b; text-decoration: none; font-weight: 600;">← Back to sign in</a>
    </p>
  </div>
</section>
{% endblock %}
