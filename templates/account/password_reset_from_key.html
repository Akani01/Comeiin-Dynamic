{% extends 'base.html' %}

{% block title %}Set new password | Comeiin Works{% endblock %}

{% block content %}
<section class="section">
  <div style="max-width: 460px; margin: 60px auto; padding: 40px 34px; background: #fff; border: 1px solid #e8e2d4; border-radius: 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);">
    <h1 style="color: #0f172a; font-size: 1.6rem; margin: 0 0 8px;">Set a new password</h1>
    <p style="color: #64748b; margin-bottom: 24px;">Choose a strong password for your account.</p>

    <form method="post" action="{{ action_url }}" style="display:flex; flex-direction:column; gap:14px;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" name="action" style="padding:13px 18px; border-radius:11px; border:none; background:linear-gradient(135deg,#f0d38a,#d7a94b); color:#17120a; font-weight:800; cursor:pointer;">Change password</button>
    </form>
  </div>
</section>
{% endblock %}
